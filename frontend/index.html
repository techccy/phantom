<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Phantom · 人机验证</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #111;
        color: #eee;
      }
      #stage {
        width: 480px;
        height: 480px;
        max-width: 90vw;
        max-height: 90vw;
        border: 1px solid #333;
        touch-action: none;
        image-rendering: pixelated;
      }
      #activate {
        width: 200px;
        height: 56px;
        font-size: 16px;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        background: #3b82f6;
        color: #fff;
        cursor: pointer;
        user-select: none;
        touch-action: none;
      }
      #activate:active {
        background: #2563eb;
      }
      #status {
        font-size: 14px;
        color: #aaa;
        min-height: 1.2em;
      }
      #result {
        font-size: 18px;
        font-weight: 600;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <button id="activate" type="button">按住跟随方块</button>
    <div id="status">加载中…</div>
    <div id="result"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

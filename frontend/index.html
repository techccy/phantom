<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phantom · 人机验证 Demo</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #111;
        color: #eee;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
      }
      .hint {
        font-size: 13px;
        color: #888;
        max-width: 480px;
        text-align: center;
      }
      /* Phantom widget 会自注入 .phantom-widget 样式，这里只给容器一个占位 */
      #app {
        background: #161616;
        border-radius: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Phantom 人机验证</h1>
    <p class="hint">
      这是官方 Demo 页（仅前端流程）。完整接入示例（含后端 token 核销闭环）见
      <code>demo.html</code> 与接入文档。
    </p>
    <!-- Phantom widget 将挂载到这里 -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

# Phantom 全栈一键部署：redis + backend + frontend。
#
# 用法：
#   docker compose up -d --build
#   打开 http://localhost           （官方 demo，前端 + 同源 /api 反代）
#   打开 http://localhost/demo.html （接入示例页，引用 ./phantom.js）
#
# 生产部署前请务必修改 .env 里的 PHANTOM_TOKEN_SECRET 与 PHANTOM_CORS_ORIGINS。

services:
  redis:
    image: redis:7-alpine
    container_name: phantom-redis
    # 仅内存，不持久化（challenge/token 都是短时一次性数据）
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    networks: [phantom-net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phantom-backend
    depends_on: [redis]
    environment:
      PHANTOM_REDIS_URL: redis://redis:6379/0
      # ⚠️ 生产部署：把下方换成你的真实域名（接入方网站的源）
      PHANTOM_CORS_ORIGINS: ${PHANTOM_CORS_ORIGINS:-http://localhost,http://localhost:8088}
      # ⚠️ 生产部署：注入稳定随机密钥（>=32 字节），多 worker 才能一致校验 token
      PHANTOM_TOKEN_SECRET: ${PHANTOM_TOKEN_SECRET:-}
    restart: unless-stopped
    networks: [phantom-net]
    # 不直接对外暴露端口：由 frontend 容器的 nginx 反代 /api 访问。
    # 如需从宿主机直连后端调试，取消注释下行：
    # ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phantom-frontend
    depends_on: [backend]
    ports:
      - "5173:80"
    restart: unless-stopped
    networks: [phantom-net]

networks:
  phantom-net:
    driver: bridge
